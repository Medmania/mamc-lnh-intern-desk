<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAMC CRMI Duty Roster Lookup</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #0284c7;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      color: var(--primary);
      text-align: center;
      margin-bottom: 4px;
      font-size: 24px;
    }
    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      border: none;
      background: #e2e8f0;
      cursor: pointer;
      font-weight: 600;
      border-radius: 8px;
      color: #475569;
      font-size: 14px;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }
    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
    }
    .input-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }
    .date-row {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .date-row input {
      background: white;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: bold;
      font-size: 13px;
    }
    .info-banner {
      background: #eff6ff;
      border-left: 4px solid var(--secondary);
      padding: 10px 14px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }
    th, td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: #f1f5f9;
      color: #334155;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>MAMC CRMI Duty Lookup</h1>
  <p class="subtitle">Compulsory Rotatory Medical Internship (2026–2027)</p>

    <div class="tabs" style="flex-wrap: wrap;">
    <button class="tab-btn active" onclick="switchTab('person')">🔍 Search Person</button>
    <button class="tab-btn" onclick="switchTab('department')">🏥 Search Department</button>
    <button class="tab-btn" onclick="switchTab('schedule')">📅 Dept Schedule & Wards</button>
    <button class="tab-btn" onclick="switchTab('lab')">🧪 Labs & Vacutainers</button>
  </div>
  <!-- TAB 4: LAB TESTS, VIALS & LOCATIONS -->
  <div id="lab-tab" class="card hidden">
    <div class="input-group">
      <label for="labSearch">Search Test, Vial Color, Window, Room, or Day (e.g., CBC, Red, Window 2, Wednesday, Room 52):</label>
      <input type="text" id="labSearch" placeholder="Type test name, vial color, location..." oninput="searchLabTests()">
    </div>
    <div id="labResults" class="results"></div>
  </div>

    <!-- TAB 3: DEPARTMENT SCHEDULE & WARDS -->
  <div id="schedule-tab" class="card hidden">
    <div class="input-group">
      <label for="deptScheduleSelect">Select Department or Special Clinic:</label>
      <select id="deptScheduleSelect" onchange="searchDeptSchedule()">
        <option value="">-- Choose Category --</option>
        <optgroup label="Main OPD Departments">
          <option value="medicine">Medicine OPD</option>
          <option value="surgery">Surgery OPD</option>
          <option value="peds_med">Pediatric Medicine OPD</option>
          <option value="peds_surg">Pediatric Surgery OPD</option>
          <option value="ent">ENT OPD</option>
          <option value="ortho">Orthopedics OPD</option>
          <option value="gynae">Gynecology & ANC OPD</option>
          <option value="derma">Dermatology & STD OPD</option>
          <option value="burns">Burns & Plastic Surgery OPD</option>
        </optgroup>
        <optgroup label="Special Evening Clinics">
          <option value="clinic_med">Medicine Special Clinics </option>
          <option value="clinic_surg">Surgery Special Clinics </option>
          <option value="clinic_peds">Pediatric Special Clinics </option>
          <option value="clinic_ortho">Ortho Special Clinics </option>
          <option value="clinic_gynae">Gynae Special Clinics </option>
          <option value="clinic_other">Other Clinics (PAC, Pain, Rabies, Senior Citizen)</option>
        </optgroup>
      </select>
    </div>
    <div id="scheduleResults" class="results"></div>
  </div>



  <!-- SHARED DATE SELECTOR -->
  <div class="card" style="margin-bottom: 16px; padding: 14px;">
    <div id="date-card" class="date-row" style="margin-bottom: 0;">
      <div style="flex: 1;">
        <label for="dutyDate" style="margin-bottom: 4px;">📅 Select Date to Check Posting:</label>
        <input type="date" id="dutyDate" min="2026-05-23" max="2027-05-22" onchange="onDateOrSelectionChange()">
      </div>
      <button onclick="setTodayDate()" style="padding: 10px 12px; border: none; background: var(--secondary); color: white; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 18px;">Today</button>
    </div>
  </div>

  <!-- TAB 1: SEARCH BY PERSON -->
  <div id="person-tab" class="card">
    <div class="input-group">
     <label for="studentSearch">Search Name, Roll No, S.No, or Batch (e.g., 29, A7, Ankit Raj):</label>
<input type="text" id="studentSearch" placeholder="Type name, roll, or serial number..." oninput="searchStudent()">

    </div>
    <div id="studentResults" class="results"></div>
  </div>

  <!-- TAB 2: SEARCH BY DEPARTMENT -->
  <div id="department-tab" class="card hidden">
    <div class="input-group">
      <label for="deptSelect">Select Department:</label>
      <select id="deptSelect" onchange="searchDepartment()">
        <option value="">-- Choose Department --</option>
        <option value="PSM">Community Medicine (PSM)</option>
        <option value="Forensic">Forensic Medicine</option>
        <option value="MED">General Medicine</option>
        <option value="Surgery">General Surgery</option>
        <option value="DVL">Dermatology (DVL)</option>
        <option value="ObsGynae">Obstetrics & Gynaecology</option>
        <option value="Psychy">Psychiatry</option>
        <option value="Pediatrics">Pediatrics</option>
        <option value="Caslty">Casualty / Emergency</option>
        <option value="ENT">ENT</option>
        <option value="Ophtha">Ophthalmology</option>
        <option value="Ortho">Orthopedics</option>
        <option value="Anaest">Anesthesia</option>
        <option value="Pulm Med">Pulmonary Medicine (Elective)</option>
        <option value="Radiology">Radiology (Elective)</option>
      </select>
    </div>
    <div id="deptResults" class="results"></div>
  </div>
</div>

  // SUBDIVISION WEEKLY SCHEDULE MAPPING FOR ALL 48 SUBDIVISIONS (A1-D12)
  function getPostingForSubdivision(subdiv, weekNum) {
    const group = subdiv.charAt(0);
    const num = parseInt(subdiv.substring(1));
    const relativeWk = ((weekNum - 1) % 13) + 1; // 1 to 13 within a block

    // BLOCK 1 (Wks 1-13): A = PSM/FM, B = Med/Surg/DVL, C = ObsGyn/Electives, D = Short Subjects
    // BLOCK 2 (Wks 14-26): A = Short, B = PSM/FM, C = Med/Surg/DVL, D = ObsGyn/Electives
    // BLOCK 3 (Wks 27-39): A = ObsGyn/Electives, B = Short, C = PSM/FM, D = Med/Surg/DVL
    // BLOCK 4 (Wks 40-52): A = Med/Surg/DVL, B = ObsGyn/Electives, C = Short, D = PSM/FM

    let blockType = '';
    if (weekNum <= 13) blockType = group === 'A' ? 'PSM_FM' : group === 'B' ? 'MED_SURG' : group === 'C' ? 'OBS_ELECT' : 'SHORT';
    else if (weekNum <= 26) blockType = group === 'A' ? 'SHORT' : group === 'B' ? 'PSM_FM' : group === 'C' ? 'MED_SURG' : 'OBS_ELECT';
    else if (weekNum <= 39) blockType = group === 'A' ? 'OBS_ELECT' : group === 'B' ? 'SHORT' : group === 'C' ? 'PSM_FM' : 'MED_SURG';
    else blockType = group === 'A' ? 'MED_SURG' : group === 'B' ? 'OBS_ELECT' : group === 'C' ? 'SHORT' : 'PSM_FM';

    // 1. PSM & Forensic Block Logic
    if (blockType === 'PSM_FM') {
      return num === relativeWk ? 'Forensic' : 'PSM';
    }

    // 2. Med, Surg, DVL Block Logic
    if (blockType === 'MED_SURG') {
      if (num <= 6) {
        if (num === relativeWk) return 'DVL';
        return relativeWk <= 7 ? 'MED' : 'Surgery';
      } else {
        if (num === relativeWk) return 'DVL';
        return relativeWk <= 6 ? 'Surgery' : 'MED';
      }
    }

    // 3. ObsGynae, Psychiatry, Electives Block Logic
    if (blockType === 'OBS_ELECT') {
      // Rotation order variations based on subgroup
      if (num <= 5) {
        if (relativeWk <= 7) return 'ObsGynae';
        if (num === 1 || num === 2) return relativeWk <= 9 ? 'Radiology' : relativeWk <= 11 ? 'Pulm Med' : 'Psychy';
        if (num === 3 || num === 4) return relativeWk <= 9 ? 'Psychy' : relativeWk <= 11 ? 'Radiology' : 'Pulm Med';
        return relativeWk <= 9 ? 'Pulm Med' : relativeWk <= 11 ? 'Psychy' : 'Radiology';
      } else if (num <= 7) {
        if (num === 6) {
          if (relativeWk === 3 || relativeWk === 8 || relativeWk === 9) return 'Pulm Med';
          if (relativeWk === 4 || relativeWk === 10 || relativeWk === 11) return 'Psychy';
          if (relativeWk === 1 || relativeWk === 2 || relativeWk === 12 || relativeWk === 13) return 'Radiology';
          return 'ObsGynae';
        } else {
          if (relativeWk <= 2) return 'Radiology';
          if (relativeWk <= 4) return 'Pulm Med';
          if (relativeWk <= 6) return 'Psychy';
          return 'ObsGynae';
        }
      } else {
        if (relativeWk >= 7) return 'ObsGynae';
        if (num === 8) return relativeWk <= 2 ? 'Radiology' : relativeWk <= 4 ? 'Pulm Med' : 'Psychy';
        if (num === 9 || num === 10) return relativeWk <= 2 ? 'Psychy' : relativeWk <= 4 ? 'Radiology' : 'Pulm Med';
        if (num === 11 || num === 12) return relativeWk <= 2 ? 'Pulm Med' : relativeWk <= 4 ? 'Psychy' : 'Radiology';
      }
    }

    // 4. Short Subjects Block Logic
    if (blockType === 'SHORT') {
      const shortSequence = ['Pediatrics', 'Pediatrics', 'Pediatrics', 'Anaest', 'Anaest', 'Caslty', 'Caslty', 'ENT', 'ENT', 'Ophtha', 'Ophtha', 'Ortho', 'Ortho'];
      let offset = 0;
      if (num === 3 || num === 4) offset = 11;
      else if (num === 5 || num === 6) offset = 9;
      else if (num === 7 || num === 8) offset = 7;
      else if (num === 9 || num === 10) offset = 5;
      else if (num === 11 || num === 12) offset = 3;

      const idx = (relativeWk - 1 + offset) % 13;
      return shortSequence[idx];
    }

    return 'General Duty';
  }

  // Universal Search Function for Lab Directory
  function searchLabTests() {
    const query = document.getElementById('labSearch').value.toLowerCase().trim();
    const resDiv = document.getElementById('labResults');
    if (!query) { resDiv.innerHTML = ''; return; }

    const matches = labDirectory.filter(item => 
      item.test.toLowerCase().includes(query) ||
      item.tube.toLowerCase().includes(query) ||
      item.window.toLowerCase().includes(query) ||
      item.days.toLowerCase().includes(query) ||
      item.report.toLowerCase().includes(query) ||
      item.notes.toLowerCase().includes(query)
    );

    if (matches.length === 0) {
      resDiv.innerHTML = '<p>No matching tests, vials, or locations found.</p>';
      return;
    }

    let html = `
      <p style="color: #64748b; font-size: 13px; margin-bottom: 10px;">Found <strong>${matches.length}</strong> matching entries:</p>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Test Name</th>
              <th>Vial / Tube</th>
              <th>Sample Window / Room</th>
              <th>Days</th>
              <th>Report Collection</th>
              <th>Key Notes</th>
            </tr>
          </thead>
          <tbody>
            ${matches.map(m => `
              <tr>
                <td><b>${m.test}</b></td>
                <td><span class="badge" style="background: #fef3c7; color: #92400e;">${m.tube}</span></td>
                <td><span class="badge" style="background: #e0f2fe; color: #0369a1;">${m.window}</span></td>
                <td>${m.days}</td>
                <td>${m.report}</td>
                <td style="font-size: 12px; color: #475569;">${m.notes}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;

    resDiv.innerHTML = html;
  }

  // INITIALIZE DATES
  window.onload = function() {
    setTodayDate();
  };

  function setTodayDate() {
    const today = new Date().toISOString().split('T')[0];
    const dateInput = document.getElementById('dutyDate');
    
    // Default to valid internship date if today is outside bounds
    if (today < "2026-05-23" || today > "2027-05-22") {
      dateInput.value = "2026-05-23";
    } else {
      dateInput.value = today;
    }
    onDateOrSelectionChange();
  }

  function getSelectedWeek() {
    const selectedDate = document.getElementById('dutyDate').value;
    for (let w of weeksData) {
      if (selectedDate >= w.start && selectedDate <= w.end) return w;
    }
    return weeksData[0]; // fallback
  }

  function onDateOrSelectionChange() {
    const activeTab = document.getElementById('person-tab').classList.contains('hidden') ? 'dept' : 'person';
    if (activeTab === 'person') searchStudent();
    else searchDepartment();
  }

   function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('person-tab').classList.add('hidden');
    document.getElementById('department-tab').classList.add('hidden');
    document.getElementById('schedule-tab').classList.add('hidden');
    document.getElementById('lab-tab').classList.add('hidden');

    const dateCard = document.getElementById('date-card');

    if (tab === 'person') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('person-tab').classList.remove('hidden');
      if (dateCard) dateCard.classList.remove('hidden');
      searchStudent();
    } else if (tab === 'department') {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('department-tab').classList.remove('hidden');
      if (dateCard) dateCard.classList.remove('hidden');
      searchDepartment();
    } else if (tab === 'schedule') {
      document.querySelectorAll('.tab-btn')[2].classList.add('active');
      document.getElementById('schedule-tab').classList.remove('hidden');
      if (dateCard) dateCard.classList.add('hidden');
      searchDeptSchedule();
    } else if (tab === 'lab') {
      document.querySelectorAll('.tab-btn')[3].classList.add('active');
      document.getElementById('lab-tab').classList.remove('hidden');
      if (dateCard) dateCard.classList.add('hidden'); // Hides Date Picker on Lab Tab
      searchLabTests();
    }
  }




  function searchStudent() {
    const query = document.getElementById('studentSearch').value.toLowerCase().trim();
    const resDiv = document.getElementById('studentResults');
    if (!query) { resDiv.innerHTML = ''; return; }

      const matches = interns.filter(i => 
      i.name.toLowerCase().includes(query) || 
      i.roll.includes(query) || 
      i.batch.toLowerCase() === query ||
      i.sno.toString() === query
    );


    if (matches.length === 0) {
      resDiv.innerHTML = '<p>No interns found matching your search.</p>';
      return;
    }

    const weekInfo = getSelectedWeek();

    let html = '';
    matches.forEach(student => {
      const activePosting = getPostingForSubdivision(student.batch, weekInfo.wk);

      html += `
        <div style="border-bottom: 1px solid var(--border); padding: 12px 0;">
          <h3>${student.name} <span class="badge">Subdivision ${student.batch}</span></h3>
          <p><strong>Roll No:</strong> ${student.roll} | <strong>S.No:</strong> ${student.sno}</p>
          
          <div class="info-banner">
            📍 <strong>Posting on Selected Date (${weekInfo.start} to ${weekInfo.end}):</strong><br>
            <span style="font-size: 16px; color: var(--primary); font-weight: bold;">${activePosting}</span> 
            <span style="font-size: 13px; color: #64748b;">(Week ${weekInfo.wk} • ${weekInfo.block})</span>
          </div>

          <details>
            <summary style="cursor: pointer; color: var(--secondary); font-weight: 600;">View 52-Week Full Roster Timeline</summary>
            <div style="max-height: 250px; overflow-y: auto; margin-top: 8px;">
              <table>
                <thead>
                  <tr><th>Wk</th><th>Date Range</th><th>Department Posting</th></tr>
                </thead>
                <tbody>
                  ${weeksData.map(w => {
                    const post = getPostingForSubdivision(student.batch, w.wk);
                    const isSelected = w.wk === weekInfo.wk;
                    return `
                      <tr ${isSelected ? 'style="background: #e0f2fe; font-weight: bold;"' : ''}>
                        <td>W${w.wk}</td>
                        <td>${w.start} to ${w.end}</td>
                        <td>${post}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </details>
        </div>
      `;
    });

    resDiv.innerHTML = html;
  }

  function searchDepartment() {
    const dept = document.getElementById('deptSelect').value;
    const resDiv = document.getElementById('deptResults');
    if (!dept) { resDiv.innerHTML = ''; return; }

    const weekInfo = getSelectedWeek();

    // Scan all 48 subdivisions (A1-D12) for matching active posting in the selected week
    const activeSubdivisions = [];
    const groups = ['A', 'B', 'C', 'D'];
    
    groups.forEach(g => {
      for (let i = 1; i <= 12; i++) {
        const sub = g + i;
        if (getPostingForSubdivision(sub, weekInfo.wk) === dept) {
          activeSubdivisions.push(sub);
        }
      }
    });

    const activeInterns = interns.filter(i => activeSubdivisions.includes(i.batch));

    let html = `
      <div class="info-banner">
        🏥 <strong>${dept} Roster</strong> for Week ${weekInfo.wk} (${weekInfo.start} to ${weekInfo.end})<br>
        <strong>Posted Subdivisions:</strong> ${activeSubdivisions.length > 0 ? activeSubdivisions.map(s => `<span class="badge" style="margin-right: 4px;">${s}</span>`).join('') : 'None'}
      </div>
    `;

    if (activeInterns.length === 0) {
      html += '<p>No interns are posted in this department during the selected week.</p>';
    } else {
      html += `
        <table>
          <thead>
            <tr><th>S.No</th><th>Roll No</th><th>Name</th><th>Subdivision</th></tr>
          </thead>
          <tbody>
            ${activeInterns.map(i => `
              <tr>
                <td>${i.sno}</td>
                <td>${i.roll}</td>
                <td><b>${i.name}</b></td>
                <td><span class="badge">${i.batch}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

        resDiv.innerHTML = html;
  }
